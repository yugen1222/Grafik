<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safia Schedule v16.2 Employee Rating Stable</title>
  <link rel="stylesheet" href="/css/style.css?v=16.2.0" />
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
  <div id="entryGateV16" class="entryGateV16">
    <div class="entryCardV16">
      <div class="entryLogoV16">🍰</div>
      <h1>Safia Schedule</h1>
      <p>Выберите режим входа</p>
      <div class="entryChoicesV16">
        <button class="entryManagerV16" onclick="enterManagerV16()"><span>👤</span><b>Менеджер</b><small>Без пароля</small></button>
        <button class="entryAdminV16" onclick="showAdminLoginV16()"><span>🔐</span><b>Администратор</b><small>Требуется пароль</small></button>
      </div>
      <div id="adminLoginBoxV16" class="adminLoginBoxV16">
        <input id="adminPasswordV16" type="password" placeholder="Пароль администратора" onkeydown="if(event.key==='Enter') enterAdminV16()">
        <button onclick="enterAdminV16()">Войти</button>
        <button class="secondary" onclick="hideAdminLoginV16()">Назад</button>
        <div id="adminLoginErrorV16" class="adminLoginErrorV16"></div>
      </div>
    </div>
  </div>

  <div class="appShell">
    <aside class="sidebar">
      <div class="brand"><span class="brandLogo">🍰</span><div><b>Safia Schedule</b><small>Сергели · график</small></div></div>
      <button class="nav active" data-page="managerBoard">🗓 <span>Рабочий график</span></button>
      <button class="nav admin-only" data-page="schedule">📅 <span>Подробный график</span></button>
      <button class="nav admin-only" data-page="dayoffs">🏖 <span>Выходные</span></button>
      <button class="nav" data-page="attendance">📋 <span>Посещаемость</span></button>
      <button class="nav admin-only" data-page="employees">👥 <span>Сотрудники</span></button>
      <button class="nav admin-only" data-page="skills">⭐ <span>Навыки</span></button>
      <button class="nav admin-only" data-page="staffing">📊 <span>Штатка</span></button>
      <button class="nav admin-only" data-page="workload">🛡️ <span>Контроль нагрузки</span></button>
      <button class="nav admin-only" data-page="managerKpi">📈 <span>KPI менеджеров</span></button>
      <button class="nav admin-only" data-page="history">📜 <span>История</span></button>
      <button class="nav admin-only" data-page="dashboard">✨ <span>Помощник</span></button>
      <div class="roleBox">
        <label>Роль</label>
        <select id="roleSelect" class="roleSelectHiddenV16"><option value="admin">Админ</option><option value="manager">Менеджер</option></select>
        <div id="managerIdentityWrap" style="display:none;margin-top:10px"><label>Кто работает</label><select id="managerIdentitySelect" onchange="setCurrentManager(this.value)"></select></div>
      <button id="switchAccessV16" class="switchAccessV16" onclick="logoutAccessV16()">⇄ Сменить вход</button></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">Safia Schedule v16.2 Employee Rating Stable</div>
          <h1 id="pageTitle">Рабочий график</h1>
          <p id="weekTitle">Неделя</p>
        </div>
        <div class="topActions">
          <button id="prevWeekBtn" class="iconBtn">←</button>
          <select id="weekSelect"></select>
          <button id="nextWeekBtn">Следующая неделя</button>
          <button id="excelBtn" class="darkBtn">Полный Excel</button>
        </div>
      </header>

      <section id="managerBoard" class="page active"></section>
      <section id="schedule" class="page"></section>
      <section id="dayoffs" class="page"></section>
      <section id="attendance" class="page"></section>
      <section id="employees" class="page"></section>
      <section id="skills" class="page"></section>
      <section id="staffing" class="page"></section>
      <section id="workload" class="page"></section>
      <section id="managerKpi" class="page"></section>
      <section id="history" class="page"></section>
      <section id="dashboard" class="page"></section>
    </main>
  </div>
  <aside id="drawer" class="drawer"></aside>
  <div id="toast" class="toast"></div>
  <script src="/js/firebase.js"></script>
  <script src="/js/app.js?v=16.2.0"></script>
</body>
</html>
